name: Coolify Deploy

# Deploy Kids Quest to Coolify when CI succeeds on main, or manually.
# Requires self-hosted runner on the Hetzner host (Coolify API on localhost:8000).
# Set repository variable COOLIFY_APP_UUID after creating the Coolify application.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'master'
        )
      )
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Deploy to Coolify
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || 'http://localhost:8000' }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_APP_UUID:-}" ]; then
            echo "::error::Missing repository variable COOLIFY_APP_UUID. Create the Coolify app, then set the variable."
            exit 1
          fi

          resolve_token() {
            if [ -n "${COOLIFY_API_TOKEN:-}" ]; then
              echo "Using COOLIFY_API_TOKEN from GitHub Actions secrets"
              return 0
            fi
            local candidates=(
              "${HOME}/.coolify/github-actions.token"
              "${HOME}/.coolify-tokens-rotated-2026-08-08/github-actions.txt"
            )
            local f
            for f in "${candidates[@]}"; do
              if [ -f "$f" ]; then
                COOLIFY_API_TOKEN="$(tr -d '[:space:]' <"$f")"
                export COOLIFY_API_TOKEN
                echo "Using Coolify API token from runner file: $f"
                return 0
              fi
            done
            echo "::error::Missing Coolify API token (secret COOLIFY_API_TOKEN or runner ~/.coolify token file)"
            exit 1
          }

          resolve_token
          echo "Using Coolify at: ${COOLIFY_BASE_URL}"
          echo "Deploying kids-gamification (${COOLIFY_APP_UUID})..."

          args=(
            -sS -w "\n%{http_code}" --max-time 60
            -X GET "${COOLIFY_BASE_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false"
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}"
            -H "Accept: application/json"
          )
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            args+=(
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
            )
          fi

          resp=$(curl "${args[@]}")
          body=$(echo "$resp" | sed '$d')
          code=$(echo "$resp" | tail -n1)
          echo "Response HTTP $code: $body"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
            echo "::error::Coolify deploy failed (HTTP $code)"
            exit 1
          fi
          echo "Queued. Check Coolify → Deployments for kids-gamification."
